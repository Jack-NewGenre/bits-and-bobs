name: CI

# Every pull request into main, and main itself so its status is always known.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push supersedes the run already in flight for the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      # Both of these build the workers first: `lib/workers/*.ts` are bundled
      # into `public/*.js` because a browser worker needs a real URL to load.
      - name: Test
        run: bun run test

      - name: Build
        run: bun run build
